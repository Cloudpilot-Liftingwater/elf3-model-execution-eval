<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELF3 模型—执行评测</title>
<style>body{font:15px system-ui;margin:32px auto;max-width:1250px;padding:0 20px;background:#f4f7fa;color:#142334}h1{font-size:27px}select,input{padding:8px;margin:4px;border:1px solid #b4c3d0;border-radius:4px}article{background:white;padding:20px;margin:18px 0;border-radius:10px}canvas{width:100%;height:360px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:right;padding:8px;border-bottom:1px solid #dde5eb}td:first-child,th:first-child{text-align:left}.legend{display:flex;gap:25px}.model{color:#9c3fa7}.command{color:#b36b06}.actual{color:#067ca2}pre{white-space:pre-wrap;max-height:300px;overflow:auto}.muted{color:#53677b}.scroll{overflow:auto}</style>
<h1>ELF3 · 模型输出—执行跟踪评测</h1><p>身体29关节 · 编码器角度反馈 · 原始时间轴 · 无统一精度达标阈值</p>
<article id="summary"></article><article>
<label>模型/运行段 <select id="segment"></select></label><label>关节 <select id="joint"></select></label><br>
<label>起点（单调秒）<input id="start" type="number" step="0.01"></label><label>终点 <input id="end" type="number" step="0.01"></label>
<div class="legend"><span class="model">— q_model</span><span class="command">— q_command</span><span class="actual">— q_actual</span></div>
<canvas id="plot"></canvas><p class="muted">角度：度。曲线均匀抽样，每段最多1600点，仅供浏览；缺口断线。统计使用全部有效样本。完整弧度数组和有效掩码在 aligned.npz。</p>
<p id="context"></p></article>
<article><label>误差 <select id="comparison"><option value="actual_minus_model">实际 − 模型（主结果）</option><option value="actual_minus_command">实际 − 指令</option><option value="command_minus_model">指令 − 模型</option></select></label>
<div class="scroll"><table><thead><tr><th>关节/部位</th><th>样本值数</th><th>MAE°</th><th>RMSE°</th><th>P95°</th><th>最大°</th><th>偏差°</th><th>样本覆盖</th><th>时间覆盖s</th><th>滞后ms</th></tr></thead><tbody id="metrics"></tbody></table></div>
<p class="muted">部位样本值数为多个关节的有效角度值总数；反馈帧数和独立模型输出次数分别报告。滞后为轨迹估计，补偿指标仅在JSON中单列，不改主误差。</p></article>
<article><details><summary>完整性、过滤原因与记录来源</summary><pre id="integrity"></pre></details></article>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),R=D.report,$=id=>document.getElementById(id);
const fmt=x=>x==null?'—':Number(x).toFixed(3);
function text(el,s){el.textContent=s}
text($('summary'),`模型结果：${R.summary.model_result}。反馈 ${R.summary.feedback_frames} 帧；29关节全部有效：模型 ${R.summary.model_valid_body29_frames} 帧，指令 ${R.summary.command_valid_body29_frames} 帧。现场验收状态不由本报告推定。`);
text($('integrity'),JSON.stringify({integrity:R.data_integrity,reasons:R.summary.reasons,source:R.source,options:R.options},null,2));
D.charts.forEach((c,i)=>$('segment').add(new Option(`${c.model||'模型未观测'} / ${c.phase} / 段${c.id}`,i)));
D.joints.forEach((n,i)=>$('joint').add(new Option(n,i)));
function selected(){return D.charts[Number($('segment').value)]}
function reset(){const c=selected();if(!c)return;$('start').value=c.t[0];$('end').value=c.t.at(-1);draw();}
function draw(){const c=selected();if(!c)return;const s=R.segments[c.id],j=Number($('joint').value),lo=Number($('start').value),hi=Number($('end').value);const canvas=$('plot'),w=canvas.clientWidth,h=360,dpr=devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
 const indices=c.t.map((t,i)=>i).filter(i=>c.t[i]>=lo&&c.t[i]<=hi),keys=['q_model','q_command','q_actual'],colors=['#9c3fa7','#b36b06','#067ca2'];
 let values=[];keys.forEach(k=>indices.forEach(i=>{if(c[k][i][j]!=null)values.push(c[k][i][j])}));let ymin=values.length?Math.min(...values):0,ymax=values.length?Math.max(...values):1;if(ymax-ymin<.01){ymin-=1;ymax+=1}const pad=(ymax-ymin)*.1;ymin-=pad;ymax+=pad;
 const X=t=>60+(t-lo)/Math.max(hi-lo,.001)*(w-80),Y=q=>h-40-(q-ymin)/(ymax-ymin)*(h-65);ctx.font='12px system-ui';ctx.fillStyle='#53677b';for(let k=0;k<=4;k++){const v=ymin+(ymax-ymin)*k/4;ctx.fillText(v.toFixed(1)+'°',3,Y(v));ctx.strokeStyle='#e2e9ef';ctx.beginPath();ctx.moveTo(55,Y(v));ctx.lineTo(w-15,Y(v));ctx.stroke()}ctx.fillText(lo.toFixed(3)+'s',60,h-10);ctx.fillText(hi.toFixed(3)+'s',w-100,h-10);
 keys.forEach((key,k)=>{ctx.strokeStyle=colors[k];ctx.lineWidth=1.5;ctx.beginPath();let last=null;indices.forEach(i=>{const q=c[key][i][j];if(q==null){last=null;return}if(last==null||c.t[i]-c.t[last]>Math.max(s.thresholds.feedback_gap_s,(hi-lo)/800)){ctx.moveTo(X(c.t[i]),Y(q))}else ctx.lineTo(X(c.t[i]),Y(q));last=i});ctx.stroke()});
 text($('context'),`段${s.id}：${s.inference_events}次模型输出、${s.feedback_events}帧反馈；状态 ${s.phase}；分段原因 ${s.boundary}。指令年龄上限 ${fmt(s.thresholds.command_age_s*1000)}ms，模型年龄上限 ${fmt(s.thresholds.model_age_s*1000)}ms。`);
 $('metrics').replaceChildren();Object.entries(s.comparisons[$('comparison').value]).forEach(([name,m])=>{const tr=document.createElement('tr');[name,m.n,fmt(m.mae_deg),fmt(m.rmse_deg),fmt(m.p95_abs_deg),fmt(m.max_abs_deg),fmt(m.bias_deg),fmt(m.sample_coverage*100)+'%',fmt(m.all_joints_time_coverage_s),m.lag.estimated_lag_ms==null?m.lag.status:fmt(m.lag.estimated_lag_ms)].forEach(v=>{const td=document.createElement('td');text(td,String(v));tr.append(td)});$('metrics').append(tr)})}
 $('segment').onchange=reset;['joint','start','end','comparison'].forEach(k=>$(k).onchange=draw);window.onresize=draw;reset();
</script></html>
